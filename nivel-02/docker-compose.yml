version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_db_nv2
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  etl:
    build: .
    container_name: etl_app_container
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_HOST=db
    volumes:
      - .:/app

volumes:
  pgdata: